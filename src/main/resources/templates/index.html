<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h2>🔗 Simple URL Shortener</h2>
                </div>
                <div class="card-body">
                    <form th:action="@{/shorten}" method="post" th:object="${urlRequest}">
                        <div class="mb-3">
                            <label class="form-label">Enter Long URL</label>
                            <input type="url" class="form-control" th:field="*{originalUrl}"
                                   placeholder="https://example.com/very/long/url" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Shorten URL</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
