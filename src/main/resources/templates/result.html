<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Short URL Generated</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-success text-white text-center">
                    <h3>✅ URL Shortened Successfully!</h3>
                </div>
                <div class="card-body">
                    <p><strong>Original URL:</strong></p>
                    <p class="text-break" th:text="${originalUrl}"></p>

                    <p><strong>Your Short URL:</strong></p>
                    <div class="input-group">
                        <input type="text" class="form-control" th:value="${shortUrl}" id="shortUrl" readonly>
                        <button class="btn btn-outline-primary" onclick="copyToClipboard()">Copy</button>
                    </div>

                    <div class="mt-4 text-center">
                        <a href="/" class="btn btn-primary">Shorten Another URL</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function copyToClipboard() {
        const shortUrl = document.getElementById("shortUrl");
        shortUrl.select();
        document.execCommand("copy");
        alert("Short URL copied to clipboard!");
    }
</script>
</body>
</html>
